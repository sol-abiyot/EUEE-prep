<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EUEE Prep{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('home') }}"><strong>EUEE Prep</strong></a>
        <nav class="account">
            {% if current_user %}
            <span>{{ current_user.display_name or current_user.username }}</span>
            <form method="post" action="{{ url_for('logout') }}">
                <button type="submit" class="link-button">Log out</button>
            </form>
            {% else %}
            <a href="{{ url_for('login') }}">Log in</a>
            <a href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>All practice questions are original EUEE-style questions, not official past-paper questions.</p>
    </footer>
</body>
</html>
