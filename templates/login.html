{% extends "base.html" %}

{% block title %}Log in - EUEE Prep{% endblock %}

{% block content %}
<h1>Log in</h1>

{% if next_url %}
<p class="notice">Please log in or register to start practising.</p>
{% endif %}

{% if error %}
<div class="errors"><p>{{ error }}</p></div>
{% endif %}

<form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">

    <button type="submit">Log in</button>
</form>

<p>New here? <a href="{{ url_for('register', next=next_url or None) }}">Create an account</a></p>
{% endblock %}
